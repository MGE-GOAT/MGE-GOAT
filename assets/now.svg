<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270"><defs><style>
.o{fill:none;stroke:#eceff6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#4f8cff;stroke:#eceff6;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.b{fill:#171b25;stroke:#eceff6;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.sh{fill:#9b7bff;opacity:.4}
.dot{fill:#eceff6}
.scr{fill:#05070a;stroke:#eceff6;stroke-width:2}
.eye{fill:#4f8cff;transform-box:fill-box;transform-origin:center;animation:bl 4.2s infinite}
.wing{transform-box:fill-box;transform-origin:50% 100%;animation:fl .24s ease-in-out infinite alternate}
.needle{transform-box:fill-box;transform-origin:50% 100%;animation:nd 4s ease-in-out infinite}
.wv{opacity:.25;animation:wv 1.6s ease-in-out infinite} .w2{animation-delay:.3s}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes fl{to{transform:scaleY(.55) rotate(6deg)}}
@keyframes nd{0%,100%{transform:rotate(-38deg)}45%{transform:rotate(32deg)}70%{transform:rotate(10deg)}}
@keyframes wv{50%{opacity:1}}
@keyframes pulse{50%{opacity:.3}}
</style><linearGradient id="gb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#9b7bff"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9b7bff"/><stop offset="1" stop-color="#ff7a59"/></linearGradient><linearGradient id="gline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset=".55" stop-color="#9b7bff"/><stop offset="1" stop-color="#ff7a59"/></linearGradient></defs><rect x="0" y="0" width="592" height="270" rx="20" fill="#0f131b" stroke="#1c2230"/><g transform="translate(26 24) scale(1.1)"><rect class="sh" x="12" y="14" width="42" height="40" rx="12"/><rect class="b" x="8" y="10" width="42" height="40" rx="12"/><rect class="scr" x="14" y="17" width="30" height="21" rx="8"/><rect class="eye" x="21" y="23" width="5" height="9" rx="2.5"/><rect class="eye" x="32" y="23" width="5" height="9" rx="2.5"/><circle class="dot" cx="18" cy="44" r="1.8"/><circle class="dot" cx="24" cy="44" r="1.8"/><circle class="dot" cx="30" cy="44" r="1.8"/><circle fill="var(--acc)" cx="43" cy="44" r="2.4"/></g><text x="108" y="52" font-family="Georgia,'Times New Roman',serif" font-size="32" fill="#eceff6">Noban</text><text x="108" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.4" fill="#8a93a6">NOBIN  ·  OCT 2024 TO NOW</text><text x="26" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#eceff6" opacity=".88">An assistant that calls for help when an elderly person</text><text x="26" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#eceff6" opacity=".88">falls or needs it. I am the sole engineer of the device, the</text><text x="26" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#eceff6" opacity=".88">app and the server. Fall detection, the wake word, distress</text><text x="26" y="203" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#eceff6" opacity=".88">sounds and voice commands all run on a Raspberry Pi. The</text><text x="26" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#eceff6" opacity=".88">server only signals and relays.</text><rect x="608" y="0" width="592" height="270" rx="20" fill="#0f131b" stroke="#1c2230"/><image href="data:image/svg+xml;base64," x="638" y="26" width="60" height="58"/><text x="716" y="52" font-family="Georgia,'Times New Roman',serif" font-size="32" fill="#eceff6">Peekage</text><text x="716" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.4" fill="#8a93a6">APPLIED AI SCIENTIST  ·  FEB 2026 TO NOW</text><text x="634" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#eceff6" opacity=".88">PeekAI answers campaign managers' questions from live data.</text><text x="634" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#eceff6" opacity=".88">I rebuilt its core as one tool-using agent where code computes</text><text x="634" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#eceff6" opacity=".88">every number. In Peek Design, a chat that builds a survey step</text><text x="634" y="203" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#eceff6" opacity=".88">by step, I built the Audience and Context agents and the</text><text x="634" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#eceff6" opacity=".88">coordinator that routes each message across five steps.</text></svg>