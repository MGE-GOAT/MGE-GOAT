="178" width="181" height="24" rx="12" fill="#ff7a59" opacity=".14"/><text x="37" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#ff7a59">44% energy difference</text></svg>