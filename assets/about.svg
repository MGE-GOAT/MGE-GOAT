<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410"><defs><style>
.o{fill:none;stroke:#eceff6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#4f8cff;stroke:#eceff6;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.b{fill:#171b25;stroke:#eceff6;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.sh{fill:#9b7bff;opacity:.4}
.dot{fill:#eceff6}
.scr{fill:#05070a;stroke:#eceff6;stroke-width:2}
.eye{fill:#4f8cff;transform-box:fill-box;transform-origin:center;animation:bl 4.2s infinite}
.wing{transform-box:fill-box;transform-origin:50% 100%;animation:fl .24s ease-in-out infinite alternate}
.needle{transform-box:fill-box;transform-origin:50% 100%;animation:nd 4s ease-in-out infinite}
.wv{opacity:.25;animation:wv 1.6s ease-in-out infinite} .w2{animation-delay:.3s}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes fl{to{transform:scaleY(.55) rotate(6deg)}}
@keyframes nd{0%,100%{transform:rotate(-38deg)}45%{transform:rotate(32deg)}70%{transform:rotate(10deg)}}
@keyframes wv{50%{opacity:1}}
@keyframes pulse{50%{opacity:.3}}
.sig{stroke-dasharray:3 5;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.bl{transform-box:fill-box;transform-origin:center;animation:bl 4.2s infinite}
</style><linearGradient id="gb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#9b7bff"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9b7bff"/><stop offset="1" stop-color="#ff7a59"/></linearGradient><linearGradient id="gline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset=".55" stop-color="#9b7bff"/><stop offset="1" stop-color="#ff7a59"/></linearGradient></defs><rect x="0" y="0" width="640" height="410" rx="22" fill="#0f131b" stroke="#1c2230"/><text x="32" y="70" font-family="Georgia,'Times New Roman',serif" font-size="32" fill="#eceff6">I am a machine learning engineer</text><text x="32" y="108" font-family="Georgia,'Times New Roman',serif" font-size="32" fill="#eceff6">who builds AI close to the metal.</text><text x="32" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#eceff6" opacity=".85">I design small models that run on the device and agents that</text><text x="32" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#eceff6" opacity=".85">answer from real data. At Nobin I built an elderly emergency</text><text x="32" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#eceff6" opacity=".85">assistant end to end. At Peekage and for Spun Holding I build</text><text x="32" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#eceff6" opacity=".85">agent systems, retrieval and automation for real products. I</text><text x="32" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#eceff6" opacity=".85">finished my M.Sc. in biomedical engineering at Sharif University</text><text x="32" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#eceff6" opacity=".85">of Technology, where my thesis was about robust on-device</text><text x="32" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#eceff6" opacity=".85">keyword spotting.</text><rect x="32.5" y="326.5" width="142" height="33" rx="16.5" fill="none" stroke="#1c2230"/><circle cx="49" cy="343" r="3.5" fill="#ff7a59"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="62" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#eceff6">Tehran, Iran</text><rect x="183.5" y="326.5" width="325" height="33" rx="16.5" fill="none" stroke="#1c2230"/><circle cx="200" cy="343" r="3.5" fill="#4f8cff"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="213" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#eceff6">Open to remote work and relocation</text><rect x="32.5" y="366.5" width="167" height="33" rx="16.5" fill="none" stroke="#1c2230"/><circle cx="49" cy="383" r="3.5" fill="#9b7bff"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="62" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#eceff6">Linux every day</text><rect x="660" y="0" width="540" height="196" rx="20" fill="#0f131b" stroke="#1c2230"/><text x="686" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.6" fill="#9b7bff">EDUCATION</text><text x="686" y="70" font-family="Georgia,'Times New Roman',serif" font-size="18" fill="#eceff6">M.Sc. Biomedical Engineering</text><text x="686" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a93a6">Bioelectric  ·  Sharif University of Technology</text><text x="686" y="103" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="1" fill="#4f8cff">2024 TO 2026  ·  GPA 3.5 / 4.0</text><text x="686" y="132" font-family="Georgia,'Times New Roman',serif" font-size="18" fill="#eceff6">B.Sc. Biomedical Engineering</text><text x="686" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a93a6">Biomaterials  ·  Islamic Azad University, Science and Research</text><text x="686" y="165" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="1" fill="#4f8cff">2019 TO 2022  ·  GPA 3.4 / 4.0</text><rect x="660" y="212" width="540" height="198" rx="20" fill="#0f131b" stroke="#1c2230"/><text x="686" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.6" fill="#4f8cff">LANGUAGES</text><text x="686" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eceff6">English</text><rect x="780" y="279" width="46" height="8" rx="4" fill="#1c2230"/><rect x="780" y="279" width="0" height="8" rx="4" fill="url(#gb)"><animate attributeName="width" values="0;46" dur=".6s" begin="0.30s" fill="freeze"/></rect><rect x="832" y="279" width="46" height="8" rx="4" fill="#1c2230"/><rect x="832" y="279" width="0" height="8" rx="4" fill="url(#gb)"><animate attributeName="width" values="0;46" dur=".6s" begin="0.41s" fill="freeze"/></rect><rect x="884" y="279" width="46" height="8" rx="4" fill="#1c2230"/><rect x="884" y="279" width="0" height="8" rx="4" fill="url(#gb)"><animate attributeName="width" values="0;46" dur=".6s" begin="0.52s" fill="freeze"/></rect><rect x="936" y="279" width="46" height=